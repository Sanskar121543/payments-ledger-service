name: payments-ledger

# Profiles:
#   (none)           postgres + kafka only: run the app from your IDE with ./mvnw spring-boot:run
#   --profile lite   + app1 behind nginx, kafbat-ui, prometheus (daily work)
#   --profile full   + app2, app3, grafana (tests and demos)

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  API_KEY_HASHES: ${API_KEY_HASHES:?set API_KEY_HASHES in .env}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # The dashboard's demo buttons send their requests through nginx, so they spread over every instance.
  PAYMENTS_DEMO_BASE_URL: http://nginx
  # Heap is fixed at 320 MB inside a 768 MB container; the rest is metaspace, code cache and threads.
  JAVA_OPTS: >-
    -Xms320m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m
    -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError

x-app: &app
  build: .
  image: payments-ledger-service:local
  mem_limit: 768m
  memswap_limit: 768m
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # client_connection_check_interval lets Postgres notice a killed app within ~1s and roll back
    # its open transaction, releasing that instance's row locks.
    command: >-
      postgres -c shared_buffers=192MB -c effective_cache_size=512MB -c max_connections=60
      -c client_connection_check_interval=1s
      -c tcp_keepalives_idle=30 -c tcp_keepalives_interval=10 -c tcp_keepalives_count=3
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 768m
    memswap_limit: 768m
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image defaults to a 1 GB heap, which would not fit the 768 MB limit.
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [lite, full]
    environment:
      KAFKA_CLUSTERS_0_NAME: payments-ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
    ports:
      - "127.0.0.1:${KAFBAT_PORT:-8090}:8080"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

  app1:
    <<: *app
    profiles: [lite, full]
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    profiles: [full]
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    profiles: [full]
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  nginx:
    image: nginx:1.30.6-alpine
    profiles: [lite, full]
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      app1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [lite, full]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    mem_limit: 256m
    memswap_limit: 256m

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [full]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments-ledger.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    mem_limit: 384m
    memswap_limit: 384m
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    user: "${HOST_UID:-12345}:${HOST_GID:-12345}"
    command: ["run", "/scripts/transfers.js"]
    environment:
      BASE_URL: http://nginx
      API_KEY: ${DEMO_API_KEY:-}
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-60s}
      HARDWARE_NOTE: ${HARDWARE_NOTE:-}
      DOCKER_INFO: ${DOCKER_INFO:-}
      TOPOLOGY: ${TOPOLOGY:-}
      OTHER_LOAD: ${OTHER_LOAD:-}
      GIT_SHA: ${GIT_SHA:-}
    volumes:
      - ./load:/scripts:ro
      - ./results/k6:/results
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      nginx:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
