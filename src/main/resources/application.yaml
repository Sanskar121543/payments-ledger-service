spring:
  application:
    name: payments-ledger-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:${POSTGRES_USER:ledger}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: >-
        SET lock_timeout = '${payments.db.lock-timeout}';
        SET idle_in_transaction_session_timeout = '${payments.db.idle-in-transaction-timeout}'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs

payments:
  instance-id: ${INSTANCE_ID:local}
  db:
    lock-timeout: 2s
    idle-in-transaction-timeout: 15s
  security:
    api-keys: ${API_KEY_HASHES:}
