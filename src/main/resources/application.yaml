spring:
  application:
    name: payments-ledger-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:${POSTGRES_USER:ledger}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      data-source-properties:
        ApplicationName: ${payments.instance-id}
      # Set per connection, not server-wide, so a test's own lock-holding session is not affected.
      connection-init-sql: >-
        SET lock_timeout = '${payments.db.lock-timeout}';
        SET idle_in_transaction_session_timeout = '${payments.db.idle-in-transaction-timeout}'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      properties:
        # If Kafka is unreachable, give up after 3s instead of the default 60s, so the outbox relay
        # never holds its database transaction open for a minute.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: activity-feed
      auto-offset-reset: earliest
    listener:
      concurrency: 1
  task:
    scheduling:
      pool:
        size: 4

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  metrics:
    tags:
      # Not "instance": Prometheus already uses that label for the scrape target.
      app_instance: ${payments.instance-id}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        node-name: ${payments.instance-id}

payments:
  instance-id: ${INSTANCE_ID:local}
  db:
    lock-timeout: 2s
    idle-in-transaction-timeout: 10s
  security:
    api-keys: ${API_KEY_HASHES:}
  idempotency:
    retention: 24h
    purge-interval: 1h
  kafka:
    topic: transfer.completed
    partitions: 6
  outbox:
    poll-interval: 250ms
    batch-size: 100
    send-timeout: 5s
  rules:
    large-amount-cents: 100000
    velocity-max-per-minute: 5
  demo:
    enabled: true
    # Where the demo buttons send their real HTTP requests. Empty means this instance itself;
    # compose points it at nginx so the requests spread over all instances.
    base-url: ""
