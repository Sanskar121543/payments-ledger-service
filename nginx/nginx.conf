worker_processes 2;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","request_time":$request_time}';
    access_log /dev/stdout json;

    # Docker's embedded DNS. With `resolve`, app names are looked up at run time, so the same file
    # works when only app1 exists (lite profile) and picks up a restarted container's new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ledger {
        zone ledger 64k;
        # Passive health checks only (active checks need NGINX Plus): one failed connection takes a
        # server out of rotation for 5 seconds.
        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
        server app3:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
        # Shorter than Tomcat's 60s keep-alive, so nginx never reuses a connection Tomcat is closing.
        keepalive_timeout 30s;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Path parameters (";x") make nginx and Spring see different paths; nothing here needs them.
        if ($request_uri ~ ";") {
            return 400;
        }

        location = /actuator/health {
            proxy_pass http://ledger;
        }

        # Metrics are scraped by Prometheus on the internal network, never through the public port.
        # No trailing slash, so "/actuator" itself and every variant of it are blocked too.
        location ^~ /actuator {
            return 404;
        }

        location /v1/stream {
            proxy_pass http://ledger;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # Demo endpoints have no Idempotency-Key, so they must never be retried on another instance.
        location /v1/demo/ {
            proxy_pass http://ledger;
            proxy_read_timeout 120s;
            proxy_next_upstream off;
        }

        # Every /v1 POST requires an Idempotency-Key, so resending it to another instance after a
        # failure is safe. nginx refuses to retry POSTs unless told to with non_idempotent.
        location /v1/ {
            proxy_pass http://ledger;
            proxy_next_upstream error timeout non_idempotent;
        }

        location / {
            proxy_pass http://ledger;
        }
    }
}
